<!doctype html>
<!-- web-bench, test "render": a fixed animated page. The scene is the one the
     other graphics tests draw: a moving background, 64 blended shapes, and (as
     in the Flutter test) a grid of 24 text elements above them. It is made of
     page elements, moved once per animation frame; the browser draws one frame
     per display refresh, so the frame rate is bounded by the 60 Hz display.
     The scene is part of the workload's method: change it, and the workload's
     version changes. -->
<html>
<head>
<meta charset="utf-8">
<title>emu web-bench: render</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101418; }
  #background { position: fixed; left: -50%; top: -50%; width: 200%; height: 200%;
                background: conic-gradient(from 0deg, #123a6b, #0f6b5a, #6b5a0f, #6b0f3a, #123a6b); }
  .shape { position: fixed; left: 0; top: 0; border-radius: 18%; opacity: 0.6; will-change: transform; }
  #grid { position: fixed; left: 10%; top: 14%; width: 80%; height: 72%; display: grid;
          grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(4, 1fr); gap: 1.5%; }
  #grid div { background: rgba(16, 20, 24, 0.55); color: #f0f0f0; border-radius: 8px; display: flex;
              align-items: center; justify-content: center; font: 600 1.6vw sans-serif; }
</style>
<script src="common.js"></script>
</head>
<body>
<div id="background"></div>
<div id="shapes"></div>
<div id="grid"></div>
<script>
const MARKER = [255, 200, 0];
const SHAPES = 64, LABELS = 24;
const seconds = parseFloat(parameter("seconds", "5"));

window.addEventListener("load", () => {
  const width = innerWidth, height = innerHeight;
  const background = document.getElementById("background");
  const shapes = [];
  for (let index = 0; index < SHAPES; index++) {
    const shape = document.createElement("div");
    const size = Math.round(height * (0.06 + 0.05 * ((index * 7) % 5) / 4));
    shape.className = "shape";
    shape.style.width = shape.style.height = size + "px";
    shape.style.background = "hsl(" + (index * 360 / SHAPES) + ", 80%, 55%)";
    document.getElementById("shapes").appendChild(shape);
    shapes.push({ element: shape, size, phase: index * 0.61, speed: 0.6 + (index % 7) * 0.13 });
  }
  const labels = [];
  for (let index = 0; index < LABELS; index++) {
    const label = document.createElement("div");
    document.getElementById("grid").appendChild(label);
    labels.push(label);
  }
  markers(MARKER);

  const intervals = [];
  let started = null, last = null, frames = 0;
  function draw(time) {
    const t = (time - started) / 1000;
    background.style.transform = "rotate(" + (t * 20) + "deg)";
    for (const shape of shapes) {
      const x = (0.5 + 0.42 * Math.sin(t * shape.speed + shape.phase)) * (width - shape.size);
      const y = (0.5 + 0.42 * Math.cos(t * shape.speed * 1.3 + shape.phase * 2)) * (height - shape.size);
      shape.element.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate("
                                      + (t * 90 * shape.speed).toFixed(1) + "deg)";
    }
    for (let index = 0; index < LABELS; index++) {
      labels[index].textContent = "frame " + ((frames + index * 37) % 1000);
    }
  }
  async function frame(time) {
    if (started === null) started = time;
    if (last !== null) intervals.push(time - last);
    last = time;
    if (time - started >= seconds * 1000 && frames > 0) {
      const elapsed = (time - started) / 1000;
      intervals.sort((a, b) => a - b);
      const found = browser();
      Object.assign(found, {
        frames, seconds: Math.round(elapsed * 1000) / 1000, value: Math.round(frames / elapsed * 100) / 100,
        started_at: wallClock(started), ended_at: wallClock(time),
        frame_time_ms: { p50: percentile(intervals, 0.5), p90: percentile(intervals, 0.9),
                         p99: percentile(intervals, 0.99), max: intervals[intervals.length - 1] },
        shapes: SHAPES, labels: LABELS });
      // The last frame stays up while the launcher captures the display.
      await capture({ marker: MARKER, width, height });
      report(found);
      return;
    }
    draw(time);
    frames++;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
