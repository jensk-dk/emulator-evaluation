#@TYPE: Machine
#@NAME: tvemu-arm64-rdke
#@NEEDED_BSPLAYERS: none (QEMU's "virt" board, from openembedded-core)
#@DESCRIPTION: RDK-E on tv-emu's ARM64 virtual machine: host-native on an ARM64 host
#@RDK_FLAVOR: rdkv
#
# A fusion of two machine definitions:
#
#   raspberrypi4-64-rdke  meta-product-raspberrypi, RDK-E's reference machine:
#                         everything that makes a machine an RDK-E machine
#                         (the layer includes, the overrides, the distro
#                         settings, the virtual providers of the vendor layer)
#   qemuarm64             openembedded-core: everything about the hardware
#                         (QEMU's "virt" board with virtio devices, its kernel,
#                         its consoles, Mesa as the graphics stack)
#
# Each block below says which of the two it is from, and what was changed.
# Nothing here is built or booted yet; rdke/README.md in the repository has what is open.

# --- raspberrypi4-64-rdke: unchanged ---------------------------------------
# A .bbappend without its recipe must not stop the parse.
BB_DANGLINGAPPENDS_WARNONLY = "true"

# --- hardware: qemuarm64 in place of raspberrypi4-64 -----------------------
# raspberrypi4-64-rdke requires conf/machine/raspberrypi4-64.conf here, which
# brings the Broadcom boot files, device trees, firmware and SD card image.
# None of that exists in a VM.
#
# The CPU tune stays the Pi's (cortexa72), not qemuarm64's (cortexa57): the
# package architecture is then "cortexa72", as in the Pi's package feeds, and
# code built for it runs on every ARM64 host CPU the emulator has (-cpu host)
# and on the simulated CPUs.
DEFAULTTUNE = "cortexa72"
require conf/machine/include/arm/armv8a/tune-cortexa72.inc
require conf/machine/include/qemu.inc

# qemu.inc sets "alsa bluetooth usbgadget screen vfat". The VM has no
# Bluetooth, Wi-Fi or USB gadget port; it has a PCI bus (virtio) and a clock.
# No "vc4graphics": that is the Pi's GPU, and recipes key on it.
MACHINE_FEATURES = "alsa screen keyboard usbhost pci vfat ext2 rtc"

KERNEL_IMAGETYPE = "Image"
# PL011 serial port of the virt board, and the virtio console.
SERIAL_CONSOLES ?= "115200;ttyAMA0 115200;hvc0"
SERIAL_CONSOLES_CHECK = "${SERIAL_CONSOLES}"

# --- overrides: raspberrypi4-64-rdke, with the Pi's names replaced ---------
# The Pi has ":raspberrypi4-64:rpi:client:wpe:lxcsecure". "client", "wpe" and
# "lxcsecure" say what kind of RDK device this is and stay. "raspberrypi4-64"
# and "rpi" select Pi-specific settings in recipes and go; "qemuarm64" takes
# their place so that what openembedded-core and RDK's layers do for that
# machine (the linux-yocto kernel, for one) applies here, and "tvemu" is for
# this layer's own settings. qemu.inc has added "qemuall".
MACHINEOVERRIDES =. "qemuarm64:"
MACHINEOVERRIDES .= ":tvemu:client:wpe:lxcsecure"

# --- layer includes: raspberrypi4-64-rdke ----------------------------------
# The product and vendor includes are this layer's own (the Pi's are named
# product.inc, vendor.inc and preferred_provider.inc; other names here, so
# that both layers can be in one build). The rest come from RDK-E's common
# layers and are the same for every machine.
require conf/machine/include/tvemu-product.inc
require conf/machine/include/tvemu-vendor.inc
include conf/machine/include/middleware.inc
include conf/machine/include/application.inc

include conf/include/oss-config.inc

include conf/include/rdk-headers-versions.inc
require conf/machine/include/tvemu-preferred-provider.inc

require conf/profile.inc
require conf/rdke-config.inc
require conf/rdke-rdkm-config.inc

# --- image names: raspberrypi4-64-rdke, with the model replaced ------------
MACHINE_IMAGE_NAME = "TVEMU"
DEVICE_MODEL_NUMBER = "TVEMU"
IMAGE_NAME ?= "${IMAGE_BASENAME}-${MACHINE_IMAGE_NAME}${IMAGE_VERSION_SUFFIX}"

# --- image and boot: qemuarm64, as tv-emu's launcher boots a VM ------------
# The Pi builds an SD card image (wic) with a FAT boot partition. tv-emu gives
# QEMU the kernel and the root file system as separate files (build/vm/ARCH:
# vmlinuz, rootfs.img), so the image is a bare ext4 file system and the kernel
# stays out of it, which qemu.inc already arranges.
IMAGE_FSTYPES = "ext4 tar.bz2"
# qemu.inc has every image build QEMU for the build host, for "runqemu". The
# emulator has its own QEMU, and that build takes long.
EXTRA_IMAGEDEPENDS:remove = "qemu-system-native qemu-helper-native:do_addto_recipe_sysroot"

# For Yocto's own "runqemu", to try an image before the launcher knows it.
# The launcher will build its own command line; these record what the image
# expects: virtio disk, network, GPU, input and sound on the virt board.
QB_SYSTEM_NAME = "qemu-system-aarch64"
QB_MACHINE = "-machine virt"
QB_CPU = "-cpu cortex-a72"
QB_CPU_KVM = "-cpu host -machine gic-version=3"
QB_SMP = "-smp 4"
QB_MEM = "-m 2048"
QB_GRAPHICS = "-device virtio-gpu-pci"
QB_OPT_APPEND = "-device qemu-xhci -device usb-tablet -device usb-kbd -device virtio-sound-pci"
QB_TAP_OPT = "-netdev tap,id=net0,ifname=@TAP@,script=no,downscript=no"
QB_NETWORK_DEVICE = "-device virtio-net-pci,netdev=net0,mac=@MAC@"
QB_ROOTFS_OPT = "-drive id=disk0,file=@ROOTFS@,if=none,format=raw -device virtio-blk-pci,drive=disk0"
QB_SERIAL_OPT = "-device virtio-serial-pci -chardev null,id=virtcon -device virtconsole,chardev=virtcon"
QB_TCPSERIAL_OPT = "-device virtio-serial-pci -chardev socket,id=virtcon,port=@PORT@,host=127.0.0.1 -device virtconsole,chardev=virtcon"
