# tv-emu's product and vendor layer for RDK-E: a virtual machine in place of
# the Raspberry Pi 4 that RDK-E's reference layers describe. See rdke/README.md in the repository.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "tvemu-rdke"
BBFILE_PATTERN_tvemu-rdke = "^${LAYERDIR}/"
# Above meta-product-raspberrypi (6) and meta-vendor-raspberrypi-dev (7),
# should both ever be in a build with this layer.
BBFILE_PRIORITY_tvemu-rdke = "8"

LAYERDEPENDS_tvemu-rdke = "core"
LAYERSERIES_COMPAT_tvemu-rdke = "kirkstone"
