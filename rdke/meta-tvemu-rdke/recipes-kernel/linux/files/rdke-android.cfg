# From meta-vendor-raspberrypi-dev (android-drivers.cfg): RDK-E's services
# talk over Android's binder. CONFIG_ASHMEM is left out: the kernel has had
# no ashmem since 5.18, and 5.15 has it in staging only.
CONFIG_ANDROID=y
# CONFIG_ANDROID_BINDERFS is not set
CONFIG_ANDROID_BINDER_IPC=y
CONFIG_ANDROID_BINDER_DEVICES="binder"
