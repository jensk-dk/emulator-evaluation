# The devices of tv-emu's VM, built in so that no module has to load before
# the root file system is there.
CONFIG_PCI=y
CONFIG_PCI_HOST_GENERIC=y
CONFIG_VIRTIO=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_MMIO=y
CONFIG_VIRTIO_BLK=y
CONFIG_VIRTIO_NET=y
CONFIG_VIRTIO_CONSOLE=y
CONFIG_HW_RANDOM_VIRTIO=y
CONFIG_VIRTIO_INPUT=y
CONFIG_VIRTIO_BALLOON=y

# Display: virtio-gpu through DRM/KMS, which Westeros drives.
CONFIG_DRM=y
CONFIG_DRM_VIRTIO_GPU=y
CONFIG_DRM_FBDEV_EMULATION=y

# Sound: virtio-snd through ALSA.
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_VIRTIO=y

# Keys from the launcher (the remote control) arrive as an input device.
CONFIG_INPUT_EVDEV=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_HID=y

CONFIG_EXT4_FS=y
CONFIG_RTC_DRV_PL031=y

# 32-bit programs on the 64-bit kernel, for TVEMU_USERLAND = "32".
CONFIG_COMPAT=y
