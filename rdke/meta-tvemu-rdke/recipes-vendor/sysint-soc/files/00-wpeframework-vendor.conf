# What Thunder's process needs of the device to draw and to play: the Pi's
# drop-in (rdkvhal-sysint-raspberrypi4, 00-wpeframework-vendor.conf) with the
# VM's display in place of the Pi's.
[Unit]
Wants=enable-transition-markers.service
After=enable-transition-markers.service

[Service]
# Westeros' device backend takes the place of the EGL native display.
Environment="LD_PRELOAD=/usr/lib/libwesteros_gl.so.0"
# The VM's one DRM device, virtio-gpu. (The Pi's display is card1.)
Environment="WESTEROS_DRM_CARD=/dev/dri/card0"
# It has a single plane: everything is composed with OpenGL ES, and video is
# not on a plane of its own behind the graphics. Not on the Pi.
Environment="WESTEROS_GL_NO_PLANES=1"
Environment="WESTEROS_GL_USE_PREFERRED_MODE=1"
Environment="WESTEROS_SINK_USE_ESSRMGR=1"
Environment="WESTEROS_SINK_USE_FREERUN=1"
Environment="WESTEROS_GL_USE_GENERIC_AVSYNC=1"
Environment="WESTEROS_GL_USE_REFRESH_LOCK=1"
Environment="WESTEROS_GL_GRAPHICS_MAX_SIZE=1920x1080"
Environment="PLAYERSINKBIN_USE_WESTEROSSINK=1"
Environment="AAMP_ENABLE_WESTEROS_SINK=1"
Environment="WESTEROS_GL_NO_VBLANK=1"
