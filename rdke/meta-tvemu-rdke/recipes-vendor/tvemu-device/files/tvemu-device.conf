# The state of the virtual device that has no hardware behind it: files that
# the vendor layer's components read where a board has sensors. They are made
# anew at each start, and may be written to while the target runs, to try
# what the middleware does when the value changes.
#
# The temperature of the "SoC", in thousandths of a degree Celsius, as a
# thermal zone of the kernel gives it.
d /run/tvemu 0755 root root -
f /run/tvemu/temperature 0644 root root - 45000
#
# The power state, as the Pi's power code shows it: in the CPU's frequency
# governor. "performance" is on, "conservative" standby and deep sleep,
# "ondemand" light sleep.
f /run/tvemu/scaling_governor 0644 root root - performance
#
# The front panel's one LED, in the form of an LED of the kernel
# (/sys/class/leds/NAME): its brightness, 0 to 255, is what the middleware
# has set.
d /run/tvemu/leds 0755 root root -
d /run/tvemu/leds/ACT 0755 root root -
f /run/tvemu/leds/ACT/brightness 0644 root root - 0
f /run/tvemu/leds/ACT/max_brightness 0644 root root - 255
f /run/tvemu/leds/ACT/trigger 0644 root root - none
